<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            margin-top: 50px;
            background-color: lightblue;
        }
        .calculator{
            width: 250px;
            margin: auto;
            padding: 15px;
            border: 2px solid black;
            background-color: white;
        }
        h1 {
        color: lightgrey;
    }

        #display {
            width: 220px;
            height: 40px;
            font-size: 22px;
            text-align: right;
            margin-bottom: 10px;
            background-color: lightgray;
            border: 2px solid gray;
        }
        button {
            width: 50px;
            height: 50px;
            margin: 3px;
            font-size: 18px;
            background-color: lightyellow;
            border-radius: 5px;
        }
        button:hover {
        background-color: orange;
    }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>Calculator</h1>
        <input type="text" id="display" readonly>
        <br>
        
        <button onclick="displayvalue('7')">7</button>
        <button onclick="displayvalue('8')">8</button>
        <button onclick="displayvalue('9')">9</button>
        <button onclick="displayvalue('/')">/</button>
        <br>
        <button onclick="displayvalue('4')">4</button>
        <button onclick="displayvalue('5')">5</button>
        <button onclick="displayvalue('6')">6</button>
        <button onclick="displayvalue('*')">*</button>
        <br>
        <button onclick="displayvalue('1')">1</button>
        <button onclick="displayvalue('2')">2</button>
        <button onclick="displayvalue('3')">3</button>
        <button onclick="displayvalue('-')">-</button>
        <br>
        <button onclick="displayvalue('0')">0</button>
        <button onclick="clearD()">C</button>
        <button onclick="calculate('=')">=</button>
        <button onclick="displayvalue('+')">+</button>
        <br>

        <script>
            function displayvalue(value){
                document.getElementById("display").value=document.getElementById("display").value+value;

            }
            function clearD(){
                document.getElementById("display").value="";
            }
            function calculate(){
                var expression=document.getElementById("display").value;
                var result=eval(expression);
                document.getElementById("display").value=result;
            }
        </script>
    </div>
</body>
</html>
